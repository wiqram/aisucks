# Web-only runtime manifest for the aisucks scaffold.
#   Deployment (Next.js standalone) + NodePort Service.
# No Postgres / migrate Job / Vault injector yet — this page has no data or secrets.
# When the business idea needs a database or secrets, add (see
# base-architecture-scaffold.md §3.4/§3.5):
#   - a Postgres Deployment + ClusterIP Service (NEVER NodePort) + hostPath PV
#   - a migrate Job
#   - serviceAccountName: vault-secrets + Vault agent-inject annotations on this pod
#   - the vault/ SOPS secrets + a `Refresh Vault secrets` stage in the Jenkinsfile
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aisucks-web
  namespace: aisucks
  labels:
    app: aisucks-web
    app.kubernetes.io/part-of: aisucks
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aisucks-web
  template:
    metadata:
      labels:
        app: aisucks-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: aisucks-web
          image: container-registry.traderyolo.com/aisucks-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # Public, non-secret. Runtime (not build-inlined) so it can change without a rebuild.
            - name: NEXT_PUBLIC_SITE_URL
              value: "https://aisucks.qcguy.com"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          # Measured 2026-08-18: this container logs "✓ Ready in 0ms" 0.9s after start,
          # but initialDelaySeconds: 8 / periodSeconds: 10 meant the kubelet did not look
          # until 8s, so the pod went Ready at ~11.5s. With replicas: 2 and
          # maxUnavailable: 0 the pods replace strictly one at a time, so a rollout that
          # should take ~7s took a measured 24.8s — ~22s of it waiting on a probe for an
          # app that was already serving. The image pull was 150ms of that 24.8s.
          # failureThreshold rises in step with the shorter period so the tolerated
          # startup budget is UNCHANGED: was 8 + 10x6 = 68s, now 0 + 2x34 = 68s.
          # livenessProbe below is deliberately NOT touched — a readiness failure only
          # withholds traffic, a liveness failure KILLS the container.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 34
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # uid 1001 cannot mkdir the baked-in /app/.next/cache — give it a writable scratch dir.
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aisucks-web
  namespace: aisucks
  labels:
    app: aisucks-web
spec:
  type: NodePort
  selector:
    app: aisucks-web
  ports:
    - name: http
      nodePort: 30100
      port: 3000
      targetPort: 3000
